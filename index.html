<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors game!</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Rock Paper Scissors Game</h1>

        <!-- Contenedores para la información -->
    <div id="roundDisplay">Round: 0 / 5</div>
    <div id="scoreDisplay">Score: You 0 - 0 Computer</div>
    <h3 id="resultDisplay">Choose your weapon to start!</h3>

    <!-- Botones de juego -->
    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>

    <!-- Botón de reinicio (oculto inicialmente) -->
    <button id="resetBtn" style="display: none;">Play Again</button>
</body>
</html>
